<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 Lovart</title>
<style nonce="__PAGE_NONCE__">
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#ededed;background:#171717}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,480px);padding:32px;background:#202020;border:1px solid #383838;border-radius:20px}.brand{font-size:15px;font-weight:650;color:#b2cd65;letter-spacing:.05em}h1{font-size:27px;line-height:1.25;margin:20px 0 12px}p{color:#b8b8b8;line-height:1.6;margin:0 0 26px;font-size:14px}.field{margin-bottom:22px}label{display:block;margin-bottom:9px;font-size:14px;font-weight:600}.input-wrap{display:flex;gap:8px;align-items:center}input{min-width:0;width:100%;height:46px;border:1px solid #505050;border-radius:9px;padding:0 12px;font:inherit;font-size:14px;color:#fff;background:#151515}input:focus-visible,button:focus-visible{outline:2px solid #b2cd65;outline-offset:3px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;font-size:14px}button:disabled{cursor:default;opacity:.55}.toggle{height:44px;padding:0 12px;color:#d4d4d4;background:#333;flex:none}.hint{font-size:12px;color:#a2a2a2;margin-top:9px;line-height:1.5}.save{width:100%;height:46px;color:#192109;background:#b2cd65;font-weight:650;margin-top:2px}#message{margin:18px 0 0;font-size:14px;line-height:1.6}#message[data-state=error]{color:#ffbc97}#message[data-state=success]{color:#c3dfa0}.foot{margin-top:24px;font-size:12px;color:#999;line-height:1.5}[hidden]{display:none!important}@media(max-width:420px){body{padding:16px}main{padding:24px}}
</style></head><body><main>
<div class="brand">LOVART</div><h1>连接 Lovart</h1><p>粘贴你的 Access Key 和 Secret Key，保存后即可在 Codex 中使用。</p>
<form id="form" method="post" autocomplete="off">
<div class="field"><label for="access-key">Access Key（AK）</label><div class="input-wrap"><input id="access-key" name="access_key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="2048" required placeholder="粘贴 Access Key"><button class="toggle" type="button" data-for="access-key" aria-label="显示 Access Key" aria-pressed="false">显示</button></div></div>
<div class="field"><label for="secret-key">Secret Key（SK）</label><div class="input-wrap"><input id="secret-key" name="secret_key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="2048" required placeholder="粘贴 Secret Key"><button class="toggle" type="button" data-for="secret-key" aria-label="显示 Secret Key" aria-pressed="false">显示</button></div><div class="hint">支持 Windows Ctrl+V、Mac ⌘V 或右键粘贴，也可以从输入框中选中复制。</div></div>
<button id="save" class="save" type="submit">保存密钥</button></form>
<div id="message" role="status" aria-live="polite" hidden></div><div class="foot">密钥保存在本机，不会发送到聊天。链接有效期为 15 分钟。</div>
</main><script nonce="__PAGE_NONCE__">
const expiresAt=__EXPIRES_AT__;
let token=new URLSearchParams(location.hash.slice(1)).get('token'),saving=false,saved=false;
const form=document.getElementById('form'),button=document.getElementById('save'),message=document.getElementById('message');
const inputs=[document.getElementById('access-key'),document.getElementById('secret-key')];
function show(text,state){message.textContent=text;message.dataset.state=state;message.hidden=false;}
function disable(){for(const control of form.elements)control.disabled=true;}
for(const toggle of document.querySelectorAll('.toggle'))toggle.addEventListener('click',()=>{
 const input=document.getElementById(toggle.dataset.for),visible=input.type==='password';input.type=visible?'text':'password';
 toggle.textContent=visible?'隐藏':'显示';toggle.setAttribute('aria-pressed',String(visible));toggle.setAttribute('aria-label',`${visible?'隐藏':'显示'} ${input.name==='access_key'?'Access Key':'Secret Key'}`);
});
if(!token){disable();show('请从 Codex 中打开完整的配置链接。','error');}
const expiry=setInterval(()=>{if(!saved&&!saving&&Date.now()>=expiresAt){disable();show('配置链接已过期，请在 Codex 中重新获取。','error');clearInterval(expiry);}},1000);
form.addEventListener('submit',async event=>{
 event.preventDefault();if(saving||saved||!token)return;
 if(Date.now()>=expiresAt){disable();show('配置链接已过期，请在 Codex 中重新获取。','error');return;}
 const access_key=inputs[0].value.trim(),secret_key=inputs[1].value.trim();
 if(!access_key||!secret_key||/[\u0000-\u0020\u007f]/.test(access_key+secret_key)){show('请填写完整的 AK 和 SK，密钥中不能包含空格或换行。','error');return;}
 saving=true;button.disabled=true;button.textContent='正在保存…';message.hidden=true;
 try {
  const response=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':token},body:JSON.stringify({access_key,secret_key}),credentials:'omit',cache:'no-store'});
  const result=await response.json();
  if(!response.ok||!result.saved)throw new Error(result.error||'未能确认保存成功，请重试。');
  saved=true;token=null;clearInterval(expiry);inputs.forEach(input=>{input.value='';input.type='password';});
  document.querySelectorAll('.toggle').forEach(toggle=>{toggle.textContent='显示';toggle.setAttribute('aria-pressed','false');});
  disable();button.textContent='已保存';history.replaceState(null,'',location.pathname);show(result.message,'success');
 }catch(error){show(error instanceof TypeError?'无法连接本机配置服务，请在 Codex 中重新获取链接。':error.message,'error');}
 finally{saving=false;if(!saved){button.disabled=false;button.textContent='保存密钥';}}
});
</script></body></html>
